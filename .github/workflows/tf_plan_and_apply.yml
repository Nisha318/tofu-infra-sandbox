# .github/workflows/tf_plan_and_apply.yml
# Reusable workflow — called by deploy.yml
# Handles plan and deploy jobs for all environments

name: OpenTofu Plan and Apply

on:
  workflow_call:
    inputs:
      account_lifecycle:
        description: "Environment designator (test or main)"
        required: true
        type: string
      tfvars_file:
        description: "Path to tfvars file"
        required: true
        type: string
    secrets:
      AWS_ROLE_VERIFY:
        required: true
      AWS_ROLE_DEPLOY:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  tf-plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Verify role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_VERIFY }}
          aws-region: us-east-1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu Init
        run: |
          tofu init \
            -backend-config="key=${{ inputs.account_lifecycle }}/terraform.tfstate"

      - name: OpenTofu Plan
        run: |
          tofu plan \
            -var-file=${{ inputs.tfvars_file }}

  tf-deploy:
    name: OpenTofu Deploy
    runs-on: ubuntu-latest
    needs: tf-plan
    environment: ${{ inputs.account_lifecycle }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_DEPLOY }}
          aws-region: us-east-1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu Init
        run: |
          tofu init \
            -backend-config="key=${{ inputs.account_lifecycle }}/terraform.tfstate"

      - name: OpenTofu Apply
        run: |
          tofu apply -auto-approve \
            -var-file=${{ inputs.tfvars_file }}