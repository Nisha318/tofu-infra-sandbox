# .github/workflows/deploy.yml
# Triggers on push to main only
# Future sprint: add test branch triggering with environment-based tfvars selection

name: OpenTofu Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  set-values:
    name: Set values
    runs-on: ubuntu-latest
    outputs:
      account_lifecycle: ${{ steps.set-env.outputs.account_lifecycle }}
      tfvars_file: ${{ steps.set-env.outputs.tfvars_file }}
    steps:
      - name: Set environment outputs
        id: set-env
        run: |
          echo "account_lifecycle=main" >> $GITHUB_OUTPUT
          echo "tfvars_file=vars/main.tfvars" >> $GITHUB_OUTPUT

  tf-plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    needs: set-values
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Verify role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_VERIFY }}
          aws-region: us-east-1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu Init
        run: |
          tofu init \
            -backend-config="key=${{ needs.set-values.outputs.account_lifecycle }}/terraform.tfstate"

      - name: OpenTofu Plan
        run: |
          tofu plan \
            -var-file=${{ needs.set-values.outputs.tfvars_file }}

  tf-deploy:
    name: OpenTofu Deploy
    runs-on: ubuntu-latest
    needs: [set-values, tf-plan]
    environment: ${{ needs.set-values.outputs.account_lifecycle }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_DEPLOY }}
          aws-region: us-east-1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: OpenTofu Init
        run: |
          tofu init \
            -backend-config="key=${{ needs.set-values.outputs.account_lifecycle }}/terraform.tfstate"

      - name: OpenTofu Apply
        run: |
          tofu apply -auto-approve \
            -var-file=${{ needs.set-values.outputs.tfvars_file }}