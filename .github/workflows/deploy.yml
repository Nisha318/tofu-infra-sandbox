# .github/workflows/deploy.yml
# Caller workflow — triggers on push and calls tf_plan_and_apply.yml
# Future sprint: move tf_plan_and_apply.yml to a separate platform repo

name: OpenTofu Deploy

on:
  push:
    branches:
      - main
      - test

permissions:
  id-token: write
  contents: read

jobs:
  set-values:
    name: Set values
    runs-on: ubuntu-latest
    outputs:
      account_lifecycle: ${{ steps.set-env.outputs.account_lifecycle }}
      tfvars_file: ${{ steps.set-env.outputs.tfvars_file }}
    steps:
      - name: Set environment outputs
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "account_lifecycle=main" >> $GITHUB_OUTPUT
            echo "tfvars_file=vars/main.tfvars" >> $GITHUB_OUTPUT
          else
            echo "account_lifecycle=test" >> $GITHUB_OUTPUT
            echo "tfvars_file=vars/test.tfvars" >> $GITHUB_OUTPUT
          fi

  call-plan-and-apply:
    name: Plan and Apply
    needs: set-values
    uses: ./.github/workflows/tf_plan_and_apply.yml
    with:
      account_lifecycle: ${{ needs.set-values.outputs.account_lifecycle }}
      tfvars_file: ${{ needs.set-values.outputs.tfvars_file }}
    secrets:
      AWS_ROLE_VERIFY: ${{ secrets.AWS_ROLE_VERIFY }}
      AWS_ROLE_DEPLOY: ${{ secrets.AWS_ROLE_DEPLOY }}